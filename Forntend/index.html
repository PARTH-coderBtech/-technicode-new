```
<!-- Primary SEO -->
<title>TechInCode | Learn Technology, Coding & Digital Skills</title>

<meta
  name="description"
  content="TechInCode is an EdTech platform helping students learn coding, web development, programming, technology and digital skills through practical learning and educational resources."
/>

  name="keywords"
  content="TechInCode, coding courses, programming courses, web development, learn coding, technology education, digital skills, online learning, computer science education, coding for students"
/>

<meta name="author" content="TechInCode" />

<!-- Open Graph / Facebook / LinkedIn -->
<meta
  property="og:title"
  content="TechInCode | Learn Technology, Coding & Digital Skills"
/>

<meta
  property="og:description"
  content="Learn coding, programming, web development and digital skills with TechInCode. Practical technology education for students and learners."
/>

<meta property="og:type" content="website" />

<meta property="og:url" content="https://techincode.in/" />

<!-- Replace this URL with your actual website banner/logo image -->
<meta
  property="og:image"
  content="https://techincode.in/og-image.png"
/>

<meta property="og:site_name" content="TechInCode" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />

<meta
  name="twitter:title"
  content="TechInCode | Learn Technology, Coding & Digital Skills"
/>

<meta
  name="twitter:description"
  content="Learn coding, programming, web development and digital skills with TechInCode."
/>

<meta
  name="twitter:image"
  content="https://techincode.in/og-image.png"
/>

<!-- Theme Color -->
<meta name="theme-color" content="#071B2A" />

<link rel="icon" type="image/png" href="/favicon.png" />
